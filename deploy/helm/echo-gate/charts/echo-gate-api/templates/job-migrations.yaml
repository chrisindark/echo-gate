---
# Run-migrations-on-deploy: a Job that runs Alembic as the table owner
# (MIGRATION_DATABASE_URL) before the API serves traffic. The app's own
# DATABASE_URL connects as the non-owner echo_gate_app role so RLS applies.
# Jobs are the right shape here: migrations are idempotent, checkpointed,
# and must complete exactly once per revision — Helm hooks would run on
# every upgrade, and an initContainer per pod would serialize a fleet.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "echo-gate-api.fullname" . }}-migrations
  labels:
    {{- include "echo-gate-api.labels" . | nindent 4 }}
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "echo-gate-api.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrations
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "echo-gate-api.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrations
          image: {{ include "echo-gate-api.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["poetry", "run", "alembic", "upgrade", "head"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            {{- include "echo-gate-api.env" . | nindent 12 }}
            {{- if .Values.existingSecret }}
            - name: MIGRATION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: MIGRATION_DATABASE_URL
                  optional: true
            {{- end }}
          envFrom:
            {{- if .Values.existingSecret }}
            - secretRef:
                name: {{ .Values.existingSecret }}
            {{- end }}
            {{- range .Values.extraEnvFromSecrets }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
