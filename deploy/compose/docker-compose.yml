name: echo-gate
services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: always
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: always
    networks:
      - app-network

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=echo_gate
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d echo_gate"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always
    networks:
      - app-network

  echo-gate:
    build:
      context: ../..
    ports:
      - "8000:8000"
    environment:
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - DATABASE_URL=postgresql+psycopg://echo_gate_app:echo_gate_app@postgres:5432/echo_gate
      - DATABASE_URL_READ=postgresql+psycopg://echo_gate_app:echo_gate_app@postgres:5432/echo_gate
    depends_on:
      qdrant:
        condition: service_started
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: always
    networks:
      - app-network

  celery_worker:
    build:
      context: ../..
    environment:
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - DATABASE_URL=postgresql+psycopg://echo_gate_app:echo_gate_app@postgres:5432/echo_gate
      - DATABASE_URL_READ=postgresql+psycopg://echo_gate_app:echo_gate_app@postgres:5432/echo_gate
    depends_on:
      redis:
        condition: service_started
      qdrant:
        condition: service_started
      postgres:
        condition: service_healthy
    command: poetry run celery -A app.worker.celery_app worker --loglevel=info
    restart: always
    networks:
      - app-network

  celery_beat:
    build:
      context: ../..
    environment:
      - PYTHON_ENV=production
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
    depends_on:
      redis:
        condition: service_started
    # Beat only schedules; it never executes tasks, so it needs the broker
    # (to publish) and config, but no Qdrant/Postgres connection.
    command: poetry run celery -A app.worker.celery_app beat --loglevel=info
    restart: always
    networks:
      - app-network

volumes:
  qdrant_data:
  postgres_data:

networks:
  app-network:
    driver: bridge
