name: echo-gate-dev
#
# Echo Gate development compose configuration with live hot reload.
#
# Code changes made on the host in ./api/ are instantly reflected:
# - API (echo-gate): uvicorn auto-reloads the application
# - Celery worker (celery_worker): watchfiles auto-restarts the worker process
# - Frontend (web): Next.js Turbopack / Fast Refresh hot-reloads in the browser
#
# Usage:
#   docker compose -f deploy/compose/docker-compose.dev.yml up --build
#   Or from repository root:
#   docker compose -f docker-compose.dev.yml up --build
#

services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_dev_data:/qdrant/storage
    restart: unless-stopped
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - app-network

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=echo_gate
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d echo_gate"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - app-network

  echo-gate:
    build:
      context: ../..
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    environment:
      - PYTHON_ENV=development
      - INFERENCE_BASE_URL=${INFERENCE_DOCKER_BASE_URL:-http://host.docker.internal:7997}
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - DATABASE_URL=postgresql+psycopg://echo_gate_app:echo_gate_app@postgres:5432/echo_gate
      - DATABASE_URL_READ=postgresql+psycopg://echo_gate_app:echo_gate_app@postgres:5432/echo_gate
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME:-BAAI/bge-small-en-v1.5}
      - OLLAMA_URL=${OLLAMA_DOCKER_URL:-http://host.docker.internal:11434}
      - LLM_PROVIDER_TIMEOUT_SECONDS=${LLM_PROVIDER_TIMEOUT_SECONDS:-120.0}
      - USE_FALLBACK_LLM=${USE_FALLBACK_LLM:-false}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - CLAUDE_API_KEY=${CLAUDE_API_KEY:-}
    volumes:
      - ../../api:/workspace/api
      - ../../alembic:/workspace/alembic
      - ../../alembic.ini:/workspace/alembic.ini
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /workspace/api
    develop:
      watch:
        - action: sync
          path: ../../api
          target: /workspace/api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started
    restart: unless-stopped
    networks:
      - app-network

  celery_worker:
    build:
      context: ../..
      dockerfile: Dockerfile.dev
    environment:
      - PYTHON_ENV=development
      - INFERENCE_BASE_URL=${INFERENCE_DOCKER_BASE_URL:-http://host.docker.internal:7997}
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - DATABASE_URL=postgresql+psycopg://echo_gate_app:echo_gate_app@postgres:5432/echo_gate
      - DATABASE_URL_READ=postgresql+psycopg://echo_gate_app:echo_gate_app@postgres:5432/echo_gate
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME:-BAAI/bge-small-en-v1.5}
    volumes:
      - ../../api:/workspace/api
    command: watchfiles --filter python "celery -A app.worker.celery_app worker --loglevel=info" /workspace/api
    develop:
      watch:
        - action: sync+restart
          path: ../../api
          target: /workspace/api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started
    restart: unless-stopped
    networks:
      - app-network

  celery_beat:
    build:
      context: ../..
      dockerfile: Dockerfile.dev
    environment:
      - PYTHON_ENV=development
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    volumes:
      - ../../api:/workspace/api
    command: celery -A app.worker.celery_app beat --loglevel=info
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - app-network

  web:
    build:
      context: ../../web
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    volumes:
      - ../../web:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
    develop:
      watch:
        - action: sync
          path: ../../web
          target: /app
          ignore:
            - node_modules/
            - .next/
    restart: unless-stopped
    networks:
      - app-network

volumes:
  qdrant_dev_data:
  postgres_dev_data:

networks:
  app-network:
    driver: bridge
