[project]
name = "echo-gate"
version = "0.4.3"
description = "Echo Gate LLM Gateway"
authors = [{ name = "Christopher Paul", email = "14836101+chrisindark@users.noreply.github.com" }]
requires-python = ">=3.11,<4"
readme = "README.md"
license = "AGPL-3.0-only"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "qdrant-client>=1.9.1",
    "httpx>=0.27.0",
    "pydantic>=2.7.4",
    "python-dotenv>=1.0.1",
    "google-genai>=0.1.0",
    "sqlalchemy>=2.0.54,<3",
    "alembic>=1.20.0,<2",
    "redis>=5.0.8,<6",
    "isort>=9.0.1,<10",
    "tenacity>=9.1.4,<10",
    "fastapi-health>=0.4.0,<0.5",
    "pyjwt[crypto]>=2.8.0,<3",
    "opentelemetry-api>=1.45.2,<2",
    "opentelemetry-sdk>=1.45.2,<2",
    "opentelemetry-exporter-otlp>=1.45.2,<2",
    "tiktoken>=0.14.0,<0.15",
    "psycopg[binary]>=3.3.9,<4.0.0",
]

[project.optional-dependencies]
worker = [
    "celery>=5.6.3,<6",
    "billiard<4.3",
    "fastembed>=0.8.1,<0.9",
]

[dependency-groups]
dev = [
    "pre-commit (>=4.6.2,<5.0.0)",
    "ruff (>=0.16.10,<0.17.0)",
    "pytest (>=8.3.0)",
    "pytest-cov>=7.1.0,<8",
    "pytest-asyncio (>=0.24.0)",
    "pip-audit (>=2.7.0)",
]

[tool.hatch.build.targets.sdist]
include = ["api/app"]

[tool.hatch.build.targets.wheel]
include = ["api/app"]

[tool.hatch.build.targets.wheel.sources]
"api/app" = "app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.poetry]
requires-poetry = ">=2.3"
packages = [{ include = "app", from = "api" }]

[tool.vercel]
entrypoint = "api.app.main:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = [".", "api"]
testpaths = ["tests", "api/app"]
addopts = "-ra"
markers = [
    "unit: fast isolated unit tests",
    "integration: cross-module integration tests",
    "contract: API contract/snapshot tests",
    "e2e: end-to-end tests",
]

[tool.coverage.run]
source = ["api/app"]
branch = true
omit = [
    "*/migrations/*",
    "*/alembic/*",
    "*/tests/*",
    "*/scripts/*",
    "*/__init__.py",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
omit = [
    "*/migrations/*",
    "*/alembic/*",
    "*/tests/*",
    "*/scripts/*",
    "*/__init__.py",
    "*/venv/*",
    "*/.venv/*",
]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "def __repr__",
]

[tool.ruff]
line-length = 88
# Match the declared floor in [tool.poetry.dependencies].python ("^3.11") and
# Dockerfile (python:3.11-slim) so lint rejects syntax that only runs on newer
# interpreters (bare `except A, B:`, `type X = ...`), rather than silently
# accepting it as it did at py314.
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
]
ignore = [
    "B008", # FastAPI Depends/Field in default args
    "E501", # Line length handled by formatter
    "B904", # raise HTTPException without from e
    "UP046", # Generic class Generic[DataT] for Pydantic compatibility
    "UP042", # Class inherits from both str and Enum (StrEnum)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pyrefly]
exclude = [
    ".venv",
    "**/__pycache__",
    "dist",
    "build"
]
