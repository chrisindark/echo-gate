[tool.poetry]
name = "echo-gate"
version = "0.2.0"
description = "Echo Gate LLM Gateway"
authors = ["Christopher Paul <14836101+chrisindark@users.noreply.github.com>"]
license = "AGPL-3.0-only"
readme = "README.md"
packages = [{include = "app", from = "api"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = ">=0.111.0"
uvicorn = ">=0.30.1"
qdrant-client = ">=1.9.1"
httpx = ">=0.27.0"
pydantic = ">=2.7.4"
python-dotenv = ">=1.0.1"
google-genai = ">=0.1.0"
sqlalchemy = "^2.0.54"
alembic = "^1.20.0"
redis = "^5.0.8"
isort = "^9.0.1"
tenacity = "^9.1.4"
celery = "^5.6.3"
fastembed = "^0.8.1"
billiard = "<4.3"
fastapi-health = "^0.4.0"
psycopg = {version = ">=3.1", extras = ["binary"]}
opentelemetry-api = "^1.45.1"
opentelemetry-sdk = "^1.45.1"
opentelemetry-exporter-otlp = "^1.45.1"

# No torch here on purpose: dense embeddings, reranking, relevance and NLI are
# served by `inference-platform/` over HTTP (INFERENCE_BASE_URL). There is no
# in-process fallback, so sentence-transformers is not a dependency at all.
tiktoken = "^0.14.0"
pytest-cov = "^7.1.0"
pytest = "^9.2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = [".", "api"]
testpaths = ["tests", "api/app"]
addopts = "-ra"
markers = [
    "unit: fast isolated unit tests",
    "integration: cross-module integration tests",
    "contract: API contract/snapshot tests",
    "e2e: end-to-end tests",
]

[tool.coverage.run]
source = ["api/app"]
branch = true
omit = [
    "*/migrations/*",
    "*/alembic/*",
    "*/tests/*",
    "*/scripts/*",
    "*/__init__.py",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
omit = [
    "*/migrations/*",
    "*/alembic/*",
    "*/tests/*",
    "*/scripts/*",
    "*/__init__.py",
    "*/venv/*",
    "*/.venv/*",
]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "def __repr__",
]

[dependency-groups]
dev = [
    "pre-commit (>=4.6.2,<5.0.0)",
    "ruff (>=0.16.10,<0.17.0)",
    "pytest (>=8.3.0)",
    "pytest-asyncio (>=0.24.0)",
    "pip-audit (>=2.7.0)",
]

[tool.ruff]
line-length = 88
# Match the declared floor in [tool.poetry.dependencies].python ("^3.11") and
# Dockerfile (python:3.11-slim) so lint rejects syntax that only runs on newer
# interpreters (bare `except A, B:`, `type X = ...`), rather than silently
# accepting it as it did at py314.
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
]
ignore = [
    "B008", # FastAPI Depends/Field in default args
    "E501", # Line length handled by formatter
    "B904", # raise HTTPException without from e
    "UP046", # Generic class Generic[DataT] for Pydantic compatibility
    "UP042", # Class inherits from both str and Enum (StrEnum)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pyrefly]
exclude = [
    ".venv",
    "**/__pycache__",
    "dist",
    "build"
]
