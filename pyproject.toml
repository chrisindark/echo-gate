[tool.poetry]
name = "echo-gate"
version = "0.1.0"
description = "Echo Gate LLM Gateway"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = ">=0.111.0"
uvicorn = ">=0.30.1"
qdrant-client = ">=1.9.1"
sentence-transformers = ">=3.0.1"
httpx = ">=0.27.0"
pydantic = ">=2.7.4"
python-dotenv = ">=1.0.1"
google-genai = ">=0.1.0"
sqlalchemy = "^2.0.54"
alembic = "^1.20.0"
redis = "^5.0.8"
dependency-injector = "^4.49.1"
isort = "^9.0.1"
tenacity = "^9.1.4"
celery = "^5.6.3"
fastembed = "^0.8.1"
billiard = "<4.3"
fastapi-health = "^0.4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pre-commit (>=4.6.2,<5.0.0)",
    "ruff (>=0.16.10,<0.17.0)"
]
