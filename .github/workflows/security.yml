name: Security Review & Audit

on:
  push:
    branches: [master, staging]
  pull_request:
    branches: [master, staging]
  schedule:
    # Run weekly security audit on Monday at 08:00 UTC
    - cron: '0 8 * * 1'

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dependency Review Scan
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: always

  vulnerability-audit:
    name: Audit Monorepo Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: "2.4.1"
          virtualenvs-in-project: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: poetry

      - name: Install backend dependencies
        run: poetry install --with dev --no-interaction

      - name: Audit Python dependencies (pip-audit)
        run: poetry run python scripts/audit_python.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: cd web && npm ci

      - name: Audit Node dependencies (npm audit)
        run: cd web && npm audit --audit-level=high
