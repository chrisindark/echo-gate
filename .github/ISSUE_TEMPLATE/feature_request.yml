name: ✨ Feature request
description: Suggest a capability for Echo Gate.
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: This is not already on the roadmap (docs/ROADMAP.md); if it is, I reference it
          required: true
        - label: I consider this a must-have for self-hosting (striking this helps maintainers prioritize)
