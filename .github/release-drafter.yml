version-template: "$MAJOR.$MINOR.$PATCH"
template: |
  ## What's Changed

  $CHANGES

  **Full Changelog**: https://github.com/chrisindark/echo-gate/compare/$PREVIOUS_TAG...$RESOLVED_VERSION
categories:
  - title: "🚀 Features"
    labels: ["feat", "feature", "enhancement"]
  - title: "🐛 Bug fixes"
    labels: ["fix", "bugfix", "bug"]
  - title: "🛡 Security"
    labels: ["security"]
  - title: "📝 Documentation"
    labels: ["docs", "documentation"]
  - title: "🧪 Testing"
    labels: ["test", "tests"]
  - title: "🔧 Maintenance"
    labels: ["chore", "refactor", "ci", "build"]
tag-latest: true
autolabeler:
  - label: "feat"
    title: ["/^feat|^✨/"]
  - label: "fix"
    title: ["/^fix|^🐛/"]
  - label: "docs"
    title: ["/^docs|^📝/"]
  - label: "chore"
    title: ["/^chore|^ci|^build|^🔧/"]
