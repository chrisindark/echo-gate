apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "inference-platform.fullname" . }}
  labels:
    {{- include "inference-platform.labels" . | nindent 4 }}
spec:
  {{- if or .Values.recreateOnUpdate (and .Values.modelCache.persistence.enabled (eq .Values.modelCache.persistence.accessMode "ReadWriteOnce")) }}
  # A ReadWriteOnce model volume cannot be attached to two pods on different
  # nodes, so the old pod must be gone before the new one mounts it.
  strategy:
    type: Recreate
  {{- else }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  {{- end }}
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "inference-platform.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if and .Values.modelCache.persistence.enabled (not .Values.modelCache.prefetch.enabled) }}
        # Weights are downloaded on first start when the cache volume is empty.
        # Bump the startup probe budget if that download is slow on your network.
        inference.echo-gate/cache-warmup: "lazy"
        {{- end }}
      labels:
        {{- include "inference-platform.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "inference-platform.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- if and .Values.modelCache.persistence.enabled .Values.modelCache.prefetch.enabled }}
      initContainers:
        - name: prefetch
          image: {{ include "inference-platform.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["inference-platform-prefetch"]
          env:
            {{- include "inference-platform.env" . | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.modelCache.prefetch.resources | nindent 12 }}
          volumeMounts:
            - name: models
              mountPath: /models
      {{- end }}
      containers:
        - name: inference
          image: {{ include "inference-platform.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 7997
              protocol: TCP
          env:
            {{- include "inference-platform.env" . | nindent 12 }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.modelCache.persistence.enabled }}
          volumeMounts:
            - name: models
              mountPath: /models
          {{- end }}
      {{- if .Values.modelCache.persistence.enabled }}
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: {{ include "inference-platform.fullname" . }}-models
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
