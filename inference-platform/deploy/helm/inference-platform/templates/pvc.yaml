{{- if .Values.modelCache.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "inference-platform.fullname" . }}-models
  labels:
    {{- include "inference-platform.labels" . | nindent 4 }}
  {{- with .Values.modelCache.persistence.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  accessModes:
    - {{ .Values.modelCache.persistence.accessMode }}
  {{- with .Values.modelCache.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.modelCache.persistence.size }}
{{- end }}
